<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Lofi night coding banner</title>
  <desc id="desc">A quiet animated night scene with a moon, stars, desk, coffee, and glowing laptop.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#15162d"/>
      <stop offset="1" stop-color="#241a38"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8fb7ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8fb7ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fd7ff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#9fd7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur16"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="blur5"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .star { fill: #dbe8ff; transform-origin: center; animation: twinkle 3.8s ease-in-out infinite; }
      .star.s2 { animation-delay: -1.2s; }
      .star.s3 { animation-delay: -2.4s; }
      .cursor { animation: blink 1.1s steps(1,end) infinite; }
      .steam1 { animation: drift 4.2s ease-in-out infinite; transform-origin: 901px 248px; }
      .steam2 { animation: drift 4.2s ease-in-out infinite -1.8s; transform-origin: 917px 248px; }
      .glow { animation: breathe 5.8s ease-in-out infinite; }
      .code1 { animation: codePulse 5s ease-in-out infinite; }
      .code2 { animation: codePulse 5s ease-in-out infinite -1.2s; }
      .code3 { animation: codePulse 5s ease-in-out infinite -2.4s; }
      @keyframes twinkle { 0%,100% { opacity:.32; transform:scale(.85);} 50% { opacity:1; transform:scale(1.25);} }
      @keyframes blink { 0%,48% { opacity:1;} 49%,100% { opacity:0;} }
      @keyframes breathe { 0%,100% { opacity:.45;} 50% { opacity:.8;} }
      @keyframes drift { 0% { opacity:0; transform:translate(0,8px) scale(.92);} 35% { opacity:.7;} 100% { opacity:0; transform:translate(-8px,-30px) scale(1.08);} }
      @keyframes codePulse { 0%,100% { opacity:.52;} 50% { opacity:1;} }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#sky)"/>
  <rect x="28" y="28" width="1144" height="304" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <circle cx="956" cy="84" r="33" fill="#f6e7b5" opacity="0.92"/>
  <circle cx="971" cy="74" r="31" fill="#15162d"/>

  <circle class="star" cx="114" cy="78" r="2.2"/><circle class="star s2" cx="184" cy="120" r="1.7"/>
  <circle class="star s3" cx="256" cy="67" r="2"/><circle class="star s2" cx="342" cy="104" r="1.5"/>
  <circle class="star" cx="468" cy="64" r="1.8"/><circle class="star s3" cx="557" cy="113" r="2.1"/>
  <circle class="star s2" cx="648" cy="72" r="1.5"/><circle class="star" cx="739" cy="106" r="2"/>
  <circle class="star s3" cx="829" cy="62" r="1.7"/><circle class="star s2" cx="1070" cy="123" r="2.1"/>

  <rect x="90" y="52" width="440" height="202" rx="13" fill="#0a0f1d" stroke="#60739a" stroke-opacity="0.28"/>
  <rect x="105" y="67" width="410" height="172" rx="8" fill="#10172a"/>
  <path d="M310 67V239M105 153H515" stroke="#60739a" stroke-opacity="0.15"/>
  <rect x="105" y="67" width="410" height="172" fill="url(#windowGlow)"/>
  <path d="M105 214 C166 187 214 192 273 208 C343 227 416 203 515 220 V239 H105Z" fill="#121527"/>
  <path d="M105 228 C191 201 253 223 331 216 C393 210 452 217 515 230 V239 H105Z" fill="#0c1120"/>

  <text x="602" y="90" fill="#d9e6ff" font-size="25" font-weight="600" class="mono">chander@night:~$</text>
  <text x="602" y="124" fill="#a7b8d9" font-size="18" class="mono">building useful things with data + ai</text>
  <text x="602" y="153" fill="#7f91b4" font-size="15" class="mono code1">agents  ·  ml  ·  data systems  ·  llms</text>
  <text x="602" y="179" fill="#7f91b4" font-size="15" class="mono code2">rag  ·  mcp  ·  evaluation  ·  pipelines</text>
  <text x="602" y="205" fill="#7f91b4" font-size="15" class="mono code3">python  ·  sql  ·  azure  ·  airflow</text>
  <rect class="cursor" x="602" y="221" width="10" height="19" rx="1.5" fill="#a6c8ff"/>

  <rect x="0" y="286" width="1200" height="74" fill="#0a0d18"/>
  <rect x="74" y="278" width="1052" height="13" rx="6.5" fill="#332c3b"/>

  <ellipse class="glow" cx="639" cy="273" rx="162" ry="48" fill="url(#screenGlow)" filter="url(#blur16)"/>
  <rect x="532" y="199" width="214" height="78" rx="9" fill="#171d2e" stroke="#768ab3" stroke-opacity="0.28"/>
  <rect x="545" y="211" width="188" height="53" rx="5" fill="#0d1423"/>
  <rect x="560" y="223" width="67" height="4" rx="2" fill="#8fb7ff" opacity=".74"/>
  <rect x="560" y="234" width="103" height="4" rx="2" fill="#ccb2ff" opacity=".52"/>
  <rect x="560" y="245" width="84" height="4" rx="2" fill="#8fe0c1" opacity=".48"/>
  <path d="M514 278 H764 L790 290 H488Z" fill="#202638"/>

  <rect x="872" y="257" width="58" height="30" rx="6" fill="#554455"/>
  <path d="M930 264 C947 264 947 281 930 281" fill="none" stroke="#8a6d83" stroke-width="5"/>
  <path class="steam1" d="M899 254 C892 244 906 238 899 228" fill="none" stroke="#d9d3de" stroke-opacity=".55" stroke-width="3" stroke-linecap="round" filter="url(#blur5)"/>
  <path class="steam2" d="M915 254 C908 244 922 238 915 228" fill="none" stroke="#d9d3de" stroke-opacity=".45" stroke-width="3" stroke-linecap="round" filter="url(#blur5)"/>

  <rect x="1010" y="247" width="68" height="40" rx="5" fill="#282334"/>
  <rect x="1019" y="238" width="8" height="49" rx="3" fill="#594a67"/>
  <rect x="1032" y="242" width="8" height="45" rx="3" fill="#3f5675"/>
  <rect x="1045" y="236" width="8" height="51" rx="3" fill="#6a4b62"/>

  <text x="76" y="325" fill="#5f6f8e" font-size="13" class="mono">late nights, clean systems, curious mind.</text>
</svg>