<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="180" viewBox="0 0 1100 180" role="img" aria-labelledby="title desc">
<title id="title">Animated engineering signal flow</title>
<desc id="desc">A clean colorful animated path connecting data, machine learning, agents and production.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0a0f1f"/><stop offset=".5" stop-color="#11152a"/><stop offset="1" stop-color="#19122a"/></linearGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset=".34" stop-color="#60a5fa"/><stop offset=".67" stop-color="#c084fc"/><stop offset="1" stop-color="#fb7185"/></linearGradient>
  <radialGradient id="g1"><stop stop-color="#5eead4" stop-opacity=".9"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop stop-color="#60a5fa" stop-opacity=".9"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
  <radialGradient id="g3"><stop stop-color="#c084fc" stop-opacity=".9"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
  <radialGradient id="g4"><stop stop-color="#fb7185" stop-opacity=".9"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .label{font:600 15px monospace;fill:#edf2ff;letter-spacing:.6px}.sub{font:11px monospace;fill:#7d86a8}.node{animation:pulse 4.8s ease-in-out infinite}.n2{animation-delay:.8s}.n3{animation-delay:1.6s}.n4{animation-delay:2.4s}.spark{filter:url(#glow)}
    .s1{animation:travel 5.8s linear infinite}.s2{animation:travel 5.8s linear infinite 1.45s}.s3{animation:travel 5.8s linear infinite 2.9s}.s4{animation:travel 5.8s linear infinite 4.35s}
    .orb{animation:orbit 7s linear infinite;transform-origin:550px 90px}.orb2{animation-duration:10s;animation-direction:reverse}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1;filter:drop-shadow(0 0 8px rgba(160,130,255,.55))}}
    @keyframes travel{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(806px);opacity:0}}
    @keyframes orbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  </style>
</defs>
<rect x="2" y="2" width="1096" height="176" rx="22" fill="url(#bg)" stroke="#6d63a8" stroke-opacity=".26"/>
<text x="34" y="34" class="label">BUILD SIGNAL</text><text x="34" y="52" class="sub">from raw data to systems people can actually use</text>
<path d="M145 105 C260 68 335 138 450 105 S645 72 755 105 S890 125 955 105" fill="none" stroke="#293250" stroke-width="8" stroke-linecap="round"/>
<path d="M145 105 C260 68 335 138 450 105 S645 72 755 105 S890 125 955 105" fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round" opacity=".88"/>
<g class="spark"><circle class="s1" cx="145" cy="105" r="5" fill="#5eead4"/><circle class="s2" cx="145" cy="105" r="5" fill="#60a5fa"/><circle class="s3" cx="145" cy="105" r="5" fill="#c084fc"/><circle class="s4" cx="145" cy="105" r="5" fill="#fb7185"/></g>
<g class="node"><circle cx="145" cy="105" r="34" fill="url(#g1)" opacity=".28"/><circle cx="145" cy="105" r="19" fill="#102a31" stroke="#5eead4"/><text x="145" y="109" class="label" text-anchor="middle" font-size="12">DATA</text></g>
<g class="node n2"><circle cx="410" cy="105" r="34" fill="url(#g2)" opacity=".28"/><circle cx="410" cy="105" r="19" fill="#13233c" stroke="#60a5fa"/><text x="410" y="109" class="label" text-anchor="middle" font-size="12">ML</text></g>
<g class="node n3"><circle cx="690" cy="105" r="34" fill="url(#g3)" opacity=".28"/><circle cx="690" cy="105" r="19" fill="#25183a" stroke="#c084fc"/><text x="690" y="109" class="label" text-anchor="middle" font-size="11">AGENT</text></g>
<g class="node n4"><circle cx="955" cy="105" r="34" fill="url(#g4)" opacity=".28"/><circle cx="955" cy="105" r="19" fill="#341827" stroke="#fb7185"/><text x="955" y="109" class="label" text-anchor="middle" font-size="10">SHIP</text></g>
<g class="orb"><circle cx="550" cy="63" r="3" fill="#93c5fd" opacity=".7"/></g><g class="orb orb2"><circle cx="550" cy="50" r="2.5" fill="#f0abfc" opacity=".65"/></g>
<text x="145" y="151" class="sub" text-anchor="middle">pipelines</text><text x="410" y="151" class="sub" text-anchor="middle">models</text><text x="690" y="151" class="sub" text-anchor="middle">reason + act</text><text x="955" y="151" class="sub" text-anchor="middle">observe + improve</text>
</svg>