<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="title desc">
<title id="title">Animated coding terminal</title><desc id="desc">A dark terminal card showing an animated late-night build loop.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0c1020"/><stop offset="1" stop-color="#171128"/></linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .line{font:18px monospace;fill:#d7dcf7}.muted{fill:#77809d}.green{fill:#79f2c0}.blue{fill:#78b7ff}.pink{fill:#ee8cff}.cursor{fill:#a9efff;animation:b 1s steps(1) infinite}.l2{animation:a2 8s infinite}.l3{animation:a3 8s infinite}.l4{animation:a4 8s infinite}.pulse{animation:p 2.4s ease-in-out infinite}
    @keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}@keyframes p{0%,100%{opacity:.45}50%{opacity:1}}
    @keyframes a2{0%,15%{opacity:0}20%,100%{opacity:1}}@keyframes a3{0%,36%{opacity:0}42%,100%{opacity:1}}@keyframes a4{0%,58%{opacity:0}64%,100%{opacity:1}}
  </style>
</defs>
<rect x="2" y="2" width="1096" height="206" rx="20" fill="url(#bg)" stroke="#6d63a8" stroke-opacity=".35"/>
<rect x="2" y="2" width="1096" height="38" rx="20" fill="#15192b"/><rect x="2" y="22" width="1096" height="18" fill="#15192b"/>
<circle cx="24" cy="21" r="5" fill="#ff6b81"/><circle cx="42" cy="21" r="5" fill="#ffd166"/><circle cx="60" cy="21" r="5" fill="#64d98b"/>
<text x="88" y="27" class="muted" font-family="monospace" font-size="13">chander@night:~/build</text>
<text x="34" y="76" class="line"><tspan class="green">$</tspan> whoami</text>
<text x="34" y="108" class="line l2"><tspan class="blue">›</tspan> data + ML + AI engineer in progress</text>
<text x="34" y="140" class="line l3"><tspan class="pink">›</tspan> building agents, retrieval, evals, pipelines</text>
<text x="34" y="172" class="line l4"><tspan class="green">✓</tspan> learn → build → measure → ship</text>
<rect x="367" y="157" width="9" height="20" rx="1" class="cursor" filter="url(#g)"/>
<circle cx="1028" cy="103" r="25" fill="none" stroke="#725cff" stroke-opacity=".18" stroke-width="9"/><path d="M1028 78 A25 25 0 0 1 1052 102" fill="none" stroke="#8ed9ff" stroke-width="9" stroke-linecap="round" class="pulse"/>
<text x="988" y="151" class="muted" font-family="monospace" font-size="11">BUILDING</text>
</svg>